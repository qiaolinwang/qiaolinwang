name: Profile art

on:
  push:
    branches: [main]
    paths: [.github/workflows/profile-art.yml, scripts/stars_3d.py]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stars-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render star galaxy + star city
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STARS_TOKEN: ${{ secrets.STARS_TOKEN }}
        run: python3 scripts/stars_3d.py ${{ github.repository_owner }} profile-3d-stars
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-stars
          git commit -m "Update 3D star history" || exit 0
          git pull --rebase
          git push
